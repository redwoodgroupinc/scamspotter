# Netlify builds ScamSpotter as a fully static site (Next.js static export).
# next.config.ts switches on the export automatically when NETLIFY=true, and
# the postbuild step writes out/_headers (security headers) and out/_redirects
# (clean URLs). Set NEXT_PUBLIC_* variables in the Netlify UI, not here.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # The site is fully static, so Netlify's Next.js runtime isn't needed.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_TELEMETRY_DISABLED = "1"
